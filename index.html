
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>SHADORE License Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #08090d;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #292b36;
      border-radius: 18px;
      background: #11121a;
      box-shadow: 0 18px 60px #0007;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    .subtitle {
      text-align: center;
      color: #9294a5;
      font-size: 13px;
      margin: 12px 0 26px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 15px 0 7px;
      color: #c9cad5;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #333542;
      border-radius: 9px;
      background: #090a10;
      color: white;
      outline: none;
    }

    input:focus { border-color: #a78bfa; }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #a78bfa;
      color: #11101a;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .secondary {
      background: #252633;
      color: white;
    }

    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 9px;
      background: #090a10;
      border: 1px solid #333542;
      overflow-wrap: anywhere;
    }

    .key {
      font-weight: bold;
      color: #c4b5fd;
      margin-top: 10px;
      line-height: 1.5;
    }

    .message {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #c9cad5;
    }

    .hidden { display: none !important; }

    .small {
      color: #777b8d;
      font-size: 11px;
      text-align: center;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="logo">SHADØRE</div>
    <div class="subtitle">LICENSE GENERATOR · ADMIN PANEL</div>

    <section id="loginSection">
      <label for="email">Email admin</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="Email Supabase">

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="Password">

      <button id="loginButton" type="button">LOGIN ADMIN</button>
    </section>

    <section id="adminSection" class="hidden">
      <p id="accountLabel" class="subtitle">Panel admin</p>

      <button id="generateButton" type="button">
        GENERATE LICENSE KEY
      </button>

      <div id="result" class="result hidden">
        <div>License key:</div>
        <div id="licenseKey" class="key"></div>
        <button id="copyButton" class="secondary" type="button">
          SALIN LICENSE
        </button>
      </div>

      <button id="logoutButton" class="secondary" type="button">
        LOGOUT
      </button>
    </section>

    <div id="message" class="message" role="status"></div>
    <div class="small">SHADORE LICENSE SYSTEM</div>
  </main>

  <script>
    const PROJECT_URL =
      "https://elrvmholtuoxzbcdhant.supabase.co";

    const PUBLISHABLE_KEY =
      "sb_publishable_5fpw9OhqRmS1nV66vANP9A_npNiE71B";

    // Nama Edge Function yang kamu berikan.
    const FUNCTION_NAME = "clever-handler";

    const $ = (id) => document.getElementById(id);

    const client = window.supabase.createClient(
      PROJECT_URL,
      PUBLISHABLE_KEY
    );

    function message(text) {
      $("message").textContent = text;
    }

    function showAdmin(isLoggedIn, email = "") {
      $("loginSection").classList.toggle("hidden", isLoggedIn);
      $("adminSection").classList.toggle("hidden", !isLoggedIn);

      if (isLoggedIn) {
        $("accountLabel").textContent = "Login sebagai " + email;
      }
    }

    async function checkSession() {
      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        showAdmin(
          !!data.session,
          data.session?.user?.email || ""
        );
      } catch (error) {
        message("Gagal memeriksa sesi: " + error.message);
      }
    }

    $("loginButton").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        message("Isi email dan password terlebih dahulu.");
        return;
      }

      $("loginButton").disabled = true;
      message("Sedang login...");

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        showAdmin(true, data.user?.email || email);
        message("Login berhasil.");
      } catch (error) {
        message("Login gagal: " + error.message);
      } finally {
        $("loginButton").disabled = false;
      }
    });

    $("generateButton").addEventListener("click", async () => {
      $("generateButton").disabled = true;
      $("result").classList.add("hidden");
      message("Meminta server membuat lisensi...");

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          throw new Error("Sesi habis. Silakan login kembali.");
        }

        const { data, error } = await client.functions.invoke(
          FUNCTION_NAME,
          {
            body: { action: "generate" }
          }
        );

        if (error) {
          throw new Error(
            error.message || "Edge Function gagal dipanggil."
          );
        }

        if (!data || !data.success || !data.license_key) {
          throw new Error(
            data?.error || "Server tidak mengembalikan license key."
          );
        }

        $("licenseKey").textContent = data.license_key;
        $("result").classList.remove("hidden");
        message("License key berhasil dibuat.");
      } catch (error) {
        message("Gagal membuat lisensi: " + error.message);
      } finally {
        $("generateButton").disabled = false;
      }
    });

    $("copyButton").addEventListener("click", async () => {
      const key = $("licenseKey").textContent;

      try {
        await navigator.clipboard.writeText(key);
        message("License key berhasil disalin.");
      } catch {
        message("Clipboard gagal. Salin key secara manual.");
      }
    });

    $("logoutButton").addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        message("Logout gagal: " + error.message);
        return;
      }

      $("result").classList.add("hidden");
      showAdmin(false);
      message("Kamu sudah logout.");
    });

    checkSession();
  </script>
</body>
</html>
