name: Build Android APK

on:
  push:
    branches:
      - main # Jalankan otomatis setiap kali Anda melakukan push ke branch main
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari menu Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Mengatur versi Java (Sesuaikan versi JDK dengan proyek Android Anda, umumnya menggunakan 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Memberikan izin akses (permission) agar Gradle bisa dieksekusi
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. Menjalankan proses kompilasi APK (mode Debug)
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # 5. Mengunggah hasil APK agar bisa diunduh langsung dari GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
