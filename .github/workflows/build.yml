
name: BUILD SHADORE V1 X AZRIL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT SOURCE
        uses: actions/checkout@v4

      - name: SET UP JAVA
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SET UP GRADLE
        uses: gradle/actions/setup-gradle@v4

      - name: SET UP ANDROID SDK
        uses: android-actions/setup-android@v4

      - name: BUILD APK
        id: build_apk
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace --info > build-log.txt 2>&1
          BUILD_STATUS=$?
          echo "===== ERROR GRADLE ====="
          grep -n -E -i "e: |error:|FAILURE:|What went wrong|Caused by:|Unresolved reference|Could not resolve" build-log.txt | tail -n 60
          echo "===== AKHIR LOG ====="
          tail -n 80 build-log.txt
          exit $BUILD_STATUS

      - name: UPLOAD BUILD LOG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-LOG-${{ github.run_id }}
          path: build-log.txt
          if-no-files-found: warn

      - name: CHECK BUILD RESULT
        if: always() && steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: UPLOAD APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SHADORE-V1-X-AZRIL-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
