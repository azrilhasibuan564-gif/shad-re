name: Build shadore APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      
      
      - name: Build APK
        run: |
          echo "=== CEK FILE PROYEK ==="
          pwd
          ls -la
          echo "=== CEK FILE GRADLE ==="
          find . -maxdepth 3 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print
          
          
      
      - name: Check APK files
        if: always()
        run: |
          echo "Memeriksa file APK..."
          find . -type f -name "*.apk" -print
          echo "Pemeriksaan selesai."

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shadore-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn   
