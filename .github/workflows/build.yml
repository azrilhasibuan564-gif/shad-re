name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            SUBFOLDER=$(find . -name "gradlew" -print -quit | sed 's/\/gradlew//')
            if [ -n "$SUBFOLDER" ]; then
              cd $SUBFOLDER
            else
              gradle wrapper
            fi
          fi
          chmod +x gradlew

      # Langkah Perbaikan: Menjalankan build dengan flag stacktrace agar memunculkan pesan eror yang jelas
      - name: Build APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            SUBFOLDER=$(find . -name "gradlew" -print -quit | sed 's/\/gradlew//')
            cd $SUBFOLDER
            ./gradlew assembleDebug --stacktrace
          fi

      # Tetap unggah APK jika ada (berjaga-jaga jika sebenarnya build berhasil tapi ada warning dianggap eror)
      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
