name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Langkah Perbaikan: Otomatis membuat gradlew jika tidak ditemukan di root
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew tidak ditemukan di folder utama. Mencari di subfolder..."
            SUBFOLDER=$(find . -name "gradlew" -print -quit | sed 's/\/gradlew//')
            if [ -n "$SUBFOLDER" ]; then
              echo "Menemukan proyek di folder: $SUBFOLDER"
              cd $SUBFOLDER
            else
              echo "gradlew benar-benar tidak ada. Membuat wrapper baru..."
              gradle wrapper
            fi
          fi
          chmod +x gradlew

      # Menjalankan build (mendukung jika proyek berada di folder utama maupun subfolder)
      - name: Build APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            SUBFOLDER=$(find . -name "gradlew" -print -quit | sed 's/\/gradlew//')
            cd $SUBFOLDER
            ./gradlew assembleDebug
          fi

      # Mengunggah hasil APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
